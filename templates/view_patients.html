<!DOCTYPE html>
<html>
<head>
    <title>Patients</title>
</head>
<body>

<h2>Patient Records</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Disease</th>
    <th>Actions</th>
</tr>

{% for patient in patients %}

<tr>
    <td>{{ patient.id }}</td>
    <td>{{ patient.name }}</td>
    <td>{{ patient.age }}</td>
    <td>{{ patient.disease }}</td>

    <td>
        <a href="/update/{{ patient.id }}">Update</a>

        <a href="/delete/{{ patient.id }}">Delete</a>
    </td>
</tr>

{% endfor %}

</table>

</body>
</html>
